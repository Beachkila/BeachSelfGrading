<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create a Beach-Tag | Beach Self-Grading</title>
<meta name="description" content="Make a Beach Self-Grading tag for your card and download it as a JPG.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Beach-Tag">

<style>
  /* Site colors, sampled from beachselfgrading.com. Adjust here. */
  :root {
    --bg: #9c9285;
    --panel: #f7f2ea;
    --ink: #1f1c19;
    --muted: #5e574f;
    --line: #d8d0c4;
    --accent: #1f1c19;
    --accent-ink: #f7f2ea;
    --heading: #f7f2ea;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* Header matches beachselfgrading.com: dark band, round logo, S.We.T.A. strip as the nav */
  .site-header {
    background: #161412;
  }

  .site-header .inner {
    max-width: 1800px;
    margin: 0 auto;
    padding: 16px 40px;
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .logo { flex-shrink: 0; }

  .logo img {
    display: block;
    width: 86px;
    height: 86px;
    border-radius: 50%;
  }

  .site-header .swt-strip {
    flex: 1;
    min-width: 0;
  }

  @media (max-width: 700px) {
    .site-header .inner { padding: 10px 12px; }
    .logo { display: none; } /* logo hidden on phones so the strip has room */
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }

  h1 {
    font-family: Oswald, Arial, sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--heading);
    font-size: clamp(32px, 7vw, 56px);
    line-height: 1;
    margin: 32px 0 20px;
  }

  .card {
    background: var(--panel);
    border-radius: 10px;
    padding: 16px;
  }

  .preview canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
    background: #ddd5c9;
  }

  .preview-note {
    color: var(--muted);
    font-size: 13px;
    margin: 8px 0 0;
    text-align: center;
  }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 20px;
    margin-top: 16px;
  }

  .col h2 {
    font-family: Oswald, Arial, sans-serif;
    font-weight: 500;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 8px 0 4px;
  }

  label {
    display: block;
    font-size: 14px;
    margin: 10px 0;
  }

  input[type="text"] {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 11px 12px;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }

  input[type="text"]::placeholder { color: #a39a8f; }

  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  fieldset {
    border: 0;
    padding: 0;
    margin: 16px 0 0;
  }

  legend { font-size: 14px; padding: 0; }

  .swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }

  .swatch { position: relative; margin: 0; }

  .swatch input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
  }

  .swatch span {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 8px 8px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: #fff;
    font-size: 14px;
    cursor: pointer;
  }

  .swatch span::before {
    content: "";
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--dot);
    border: 1px solid rgba(0,0,0,0.25);
  }

  .swatch input:checked + span { border-color: var(--accent); font-weight: bold; }
  .swatch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .actions {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  #downloadBtn {
    width: 100%;
    max-width: 360px;
    padding: 14px 18px;
    font-family: Oswald, Arial, sans-serif;
    font-weight: 700;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }

  #downloadBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #downloadBtn:focus-visible { outline: 3px solid var(--bg); outline-offset: 2px; }

  #status { min-height: 18px; font-size: 13px; color: var(--muted); margin: 0; }

  footer {
    background: #161412;
    text-align: center;
    padding: 24px 16px 28px;
  }

  footer a {
    color: var(--heading);
    font-family: Oswald, Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 5vw, 32px);
    text-transform: uppercase;
    text-decoration: none;
  }

  footer a:hover, footer a:focus-visible { text-decoration: underline; }

  .community {
    text-align: center;
    padding: 4px 16px 36px;
  }

  .community p {
    margin: 0;
    color: var(--ink);
    font-family: Oswald, Arial, sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .community a.reddit-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding: 10px 22px;
    letter-spacing: normal;
    border-radius: 999px;
    background: #ff4500;
    color: #ffffff;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    text-transform: none;
    text-decoration: none;
  }

  .community a.reddit-btn svg { width: 26px; height: 26px; fill: currentColor; flex: none; }

  .community a.reddit-btn:hover,
  .community a.reddit-btn:focus-visible { background: #e03d00; text-decoration: none; }

  @media (max-width: 640px) {
    main { padding: 0 12px 32px; }
    h1 { font-size: 26px; margin: 14px 0 10px; }
    .card { padding: 10px; }
    .fields { grid-template-columns: 1fr; margin-top: 8px; }
    /* Keep the preview in view while typing on phones */
    .preview {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--panel);
      margin: -10px -10px 0;
      padding: 10px 10px 6px;
      border-radius: 10px 10px 0 0;
    }
  }
  .pickers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 20px;
    margin: 8px 0 4px;
  }

  select {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 11px 12px;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }

  select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .custom {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    margin: 0;
  }

  .custom input[type="color"] {
    width: 44px;
    height: 38px;
    padding: 2px;
    border: 2px solid var(--line);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
  }

  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    .pickers { grid-template-columns: 1fr; }
  }
</style>

<header class="site-header">
  <div class="inner">
    <a class="logo" href="https://beachselfgrading.com/">
      <img src="https://beachselfgrading.com/wp-content/uploads/2026/09/magiceraser_260923_145356.png" alt="Beach Self-Grading home">

    <div class="swt-strip" data-stop="create" data-contained></div>

</header>
<script src="https://beachkila.github.io/SiteMap/strip.js" defer></script>

<main>
  <h1>Create your Beach-Tag</h1>

  <div class="card">
    <div class="preview">
      <canvas id="canvas" width="5600" height="1600" aria-label="Preview of your Beach-Tag" role="img"></canvas>
      <p class="preview-note">The preview updates as you type.</p>
    </div>

    <div class="pickers">
      <label>Layout
        <select id="layout"></select>
      </label>
      <label>Color Style
        <select id="split">
          <option value="none">Single color</option>
          <option value="halves">Halves</option>
          <option value="topbottom">Top / bottom</option>
          <option value="pinstripe">Inner pinstripe</option>
          <option value="corners">Corners</option>
        </select>
      </label>
    </div>

    <div class="fields">
      <div class="col">
        <h2>Left side</h2>
        <label>Year / Model
          <input id="line1" type="text" maxlength="30" placeholder="2025 BOWMAN U" autocomplete="off">
        </label>
        <label>Player Name
          <input id="line2" type="text" maxlength="30" placeholder="BRYCE YOUNG" autocomplete="off">
        </label>
        <label>Card Attributes
          <input id="line3" type="text" maxlength="25" placeholder="(AUTOGRAPH)(RC)" autocomplete="off">
        </label>
      </div>
      <div class="col">
        <h2>Right side</h2>
        <label>Card Number
          <input id="line4" type="text" maxlength="9" placeholder="99 / 99" autocomplete="off">
        </label>
        <label>Card Grade
          <input id="line5" type="text" maxlength="11" placeholder="MINT 10" autocomplete="off">
        </label>
        <label>Autograph Grade
          <input id="line6" type="text" maxlength="11" placeholder="AUTO 10" autocomplete="off">
        </label>
      </div>
    </div>

    <fieldset>
      <legend>Frame Color</legend>
      <div class="swatches" id="swatches1"></div>
    </fieldset>

    <fieldset id="color2Set" hidden>
      <legend>Second Color</legend>
      <div class="swatches" id="swatches2"></div>
    </fieldset>

    <fieldset>
      <legend>Nameplate</legend>
      <div class="swatches">
        <label class="swatch" style="--dot:#ffffff"><input type="radio" name="plate" value="white" checked><span>White</span></label>
        <label class="swatch" style="--dot:#111111"><input type="radio" name="plate" value="black"><span>Black</span></label>
      </div>
    </fieldset>

    <div class="actions">
      <button id="downloadBtn" type="button">Download .JPG</button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </div>

</main>

<section class="community">
  <p>Share your BeachTag
    <a class="reddit-btn" href="https://www.reddit.com/r/BeachSelfGrading/"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.373 0 0 5.373 0 12c0 3.314 1.343 6.314 3.515 8.485l-2.286 2.286C.775 23.225 1.097 24 1.738 24H12c6.627 0 12-5.373 12-12S18.627 0 12 0Zm4.388 3.199c1.104 0 1.999.895 1.999 1.999 0 1.105-.895 2-1.999 2-.946 0-1.739-.657-1.947-1.539v.002c-1.147.162-2.032 1.15-2.032 2.341v.007c1.776.067 3.4.567 4.686 1.363.473-.363 1.064-.58 1.707-.58 1.547 0 2.802 1.254 2.802 2.802 0 1.117-.655 2.081-1.601 2.531-.088 3.256-3.637 5.876-7.997 5.876-4.361 0-7.905-2.617-7.998-5.87-.954-.447-1.614-1.415-1.614-2.538 0-1.548 1.255-2.802 2.803-2.802.645 0 1.239.218 1.712.585 1.275-.79 2.881-1.291 4.64-1.365v-.01c0-1.663 1.263-3.034 2.88-3.207.188-.911.993-1.595 1.959-1.595Zm-8.085 8.376c-.784 0-1.459.78-1.506 1.797-.047 1.016.64 1.429 1.426 1.429.786 0 1.371-.369 1.418-1.385.047-1.017-.553-1.841-1.338-1.841Zm7.406 0c-.786 0-1.385.824-1.338 1.841.047 1.017.634 1.385 1.418 1.385.785 0 1.473-.413 1.426-1.429-.046-1.017-.721-1.797-1.506-1.797Zm-3.703 4.013c-.974 0-1.907.048-2.77.135-.147.015-.241.168-.183.305.483 1.154 1.622 1.964 2.953 1.964 1.33 0 2.47-.81 2.953-1.964.057-.137-.037-.29-.184-.305-.863-.087-1.795-.135-2.769-.135Z"/></svg>r/BeachSelfGrading</a>

<script>
(() => {
  // Paste the Apps Script web app URL here (ends in /exec). Leave empty to turn logging off.
  const LOG_URL = "https://script.google.com/macros/s/AKfycbxNZUXl5coLk65ZyorhNfLWH1ve0mpQ89Bd9R-KrhulOBWncMgfgftdVYyjMI_aNV8/exec";

  // Every layout is drawn in a 560 x 160 unit space and scaled up 10x,
  // so the downloaded JPG is 5600 x 1600, same as before.
  // All layouts keep square outer corners so they cut cleanly.
  const UW = 560, UH = 160;
  const RED_A = "#ff0000", INK = "#111111", WHITE = "#ffffff", HAIR = "#bbbbbb";

  // Same colors as the original frame images.
  const PRESETS = [
    ["red", "Red", "#ff0000"],
    ["black", "Black", "#000000"],
    ["blue", "Blue", "#0030ff"],
    ["yellow", "Yellow", "#ffd300"],
    ["green", "Green", "#009900"],
  ];

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = 5600;
  canvas.height = 1600;

  const fields = {
    line1: document.getElementById("line1"),
    line2: document.getElementById("line2"),
    line3: document.getElementById("line3"),
    line4: document.getElementById("line4"),
    line5: document.getElementById("line5"),
    line6: document.getElementById("line6"),
  };

  const layoutEl = document.getElementById("layout");
  const splitEl = document.getElementById("split");
  const color2Set = document.getElementById("color2Set");
  const downloadBtn = document.getElementById("downloadBtn");
  const statusEl = document.getElementById("status");
  const plateInputs = document.querySelectorAll('input[name="plate"]');

  const state = { c1: "#ff0000", c2: "#0030ff" };
  let lastLoggedKey = null;

  // ---------- drawing helpers ----------

  function rr(c, x, y, w, h, r) {
    const [tl, tr, br, bl] = Array.isArray(r) ? r : [r, r, r, r];
    c.beginPath();
    c.moveTo(x + tl, y);
    c.lineTo(x + w - tr, y);
    c.arcTo(x + w, y, x + w, y + tr, tr);
    c.lineTo(x + w, y + h - br);
    c.arcTo(x + w, y + h, x + w - br, y + h, br);
    c.lineTo(x + bl, y + h);
    c.arcTo(x, y + h, x, y + h - bl, bl);
    c.lineTo(x, y + tl);
    c.arcTo(x, y, x + tl, y, tl);
    c.closePath();
  }

  function rect(c, x, y, w, h) { c.beginPath(); c.rect(x, y, w, h); }

  function poly(c, pts) {
    c.beginPath();
    pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
    c.closePath();
  }

  function fillWith(c, color) { c.fillStyle = color; c.fill(); }
  function strokeWith(c, color, w) { c.strokeStyle = color; c.lineWidth = w; c.stroke(); }

  function setFont(c, size, bold) {
    c.font = `${bold ? "bold " : ""}${size}px Arial, Helvetica, sans-serif`;
  }

  // One line of text that shrinks to fit maxW.
  function T(c, text, x, y, size, align = "left", maxW = Infinity) {
    if (!text) return;
    setFont(c, size);
    const w = c.measureText(text).width;
    if (w > maxW) setFont(c, size * maxW / w);
    c.fillStyle = INK;
    c.textAlign = align;
    c.textBaseline = "alphabetic";
    c.fillText(text, x, y);
  }

  // Left and right columns sharing rows. When a row's left and right text would
  // overlap, every row shrinks together so the tag keeps one consistent text size.
  function rows(c, L, R, lx, rx, ys, sizes, shadow = false) {
    const gap = 12;
    let k = 1;
    L.forEach((lt, i) => {
      setFont(c, sizes[i]);
      const w = c.measureText(lt || "").width + c.measureText(R[i] || "").width;
      const avail = rx - lx - (R[i] ? gap : 0);
      if (w > avail) k = Math.min(k, avail / w);
    });
    c.save();
    if (shadow) {
      c.shadowColor = "rgba(0,0,0,0.55)";
      c.shadowBlur = 10;
      c.shadowOffsetY = 2;
    }
    L.forEach((lt, i) => {
      T(c, lt, lx, ys[i], sizes[i] * k, "left");
      T(c, R[i], rx, ys[i], sizes[i] * k, "right");
    });
    c.restore();
  }

  function tracked(c, text, x, y, size, bold, spacing, colors) {
    setFont(c, size, bold);
    c.textAlign = "left";
    c.textBaseline = "alphabetic";
    let cx = x;
    [...text].forEach((ch, i) => {
      c.fillStyle = colors[i] || colors[0];
      c.fillText(ch, cx, y);
      cx += c.measureText(ch).width + spacing;
    });
  }

  function trackedWidth(c, text, size, bold, spacing) {
    setFont(c, size, bold);
    return [...text].reduce((s, ch) => s + c.measureText(ch).width, 0) + spacing * (text.length - 1);
  }

  function isDark(hex) {
    const n = parseInt(hex.slice(1), 16);
    const lum = (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
    return lum < 0.12;
  }

  // BEACH | SELF-GRADING nameplate.
  // White plate: black border. Black plate: no border when it sits flush on a dark frame,
  // where it takes the frame's color so it blends in.
  function nameplate(c, x, y, w, h, o, flush = false) {
    const dark = o.plate === "black";
    const blend = dark && flush && isDark(o.c1) && o.split === "none";
    const fill = blend ? o.c1 : dark ? INK : WHITE;
    const ink = dark ? WHITE : INK;
    const line = blend ? 0 : 1.4;
    const half = line / 2;
    const r = 3.6;

    if (flush) {
      // rounded top corners, square bottom corners resting on the tag's bottom edge
      const left = x + half, top = y + half, right = x + w - half, bottom = y + h - half;
      c.beginPath();
      c.moveTo(left, bottom);
      c.lineTo(left, top + r);
      c.arcTo(left, top, left + r, top, r);
      c.lineTo(right - r, top);
      c.arcTo(right, top, right, top + r, r);
      c.lineTo(right, bottom);
      c.closePath();
    } else {
      rr(c, x + half, y + half, w - line, h - line, r);
    }
    fillWith(c, fill);
    if (line) strokeWith(c, INK, line);
    if (flush) {
      c.fillStyle = line ? INK : fill;
      c.fillRect(x, y + h - half, w, half + 0.2);
    }

    let bs = h * 0.514, ss = h * 0.223;
    const bsp = () => bs * 0.11, ssp = () => ss * 0.23;
    const gap = h * 0.137, divW = h * 0.069;
    const total = () =>
      trackedWidth(c, "BEACH", bs, true, bsp()) + gap * 2 + divW +
      trackedWidth(c, "SELF-GRADING", ss, false, ssp());
    const maxW = w * 0.86;
    if (total() > maxW) { const k = maxW / total(); bs *= k; ss *= k; }

    const mid = y + h / 2;
    let cx = x + (w - total()) / 2;
    tracked(c, "BEACH", cx, mid + bs * 0.36, bs, true, bsp(), [ink, ink, RED_A, ink, ink]);
    cx += trackedWidth(c, "BEACH", bs, true, bsp()) + gap;
    c.fillStyle = RED_A;
    c.fillRect(cx, mid - h * 0.27, divW, h * 0.54);
    cx += divW + gap;
    tracked(c, "SELF-GRADING", cx, mid + ss * 0.36, ss, false, ssp(), [ink]);
  }

  // ---------- layouts ----------
  // paint(c, color): the colored parts of the frame (painted twice for split colors).
  // content(c, d, o): text and nameplate.

  const LAYOUTS = [
    // ----- Classic -----
    {
      id: "original", name: "Original", family: "Classic",
      paint(c, k) {
        c.fillStyle = k; c.fillRect(0, 0, UW, UH);
        rr(c, 20.2, 15.7, 520.8, 127.7, 4); fillWith(c, WHITE);
      },
      content(c, d, o) {
        rows(c, [d.ym, d.name, d.attr], [d.num, d.grade, d.auto], 30, 535, [42.5, 77.5, 112.5], [30, 30, 30], true);
        nameplate(c, 170, 123.6, 220, 36.4, o, true);
      },
    },
    {
      id: "header", name: "Header band", family: "Classic",
      paint(c, k) {
        rect(c, 2, 2, 556, 156); strokeWith(c, k, 4);
        c.fillStyle = k; c.fillRect(0, 0, UW, 42);
      },
      content(c, d, o) {
        rows(c, [d.ym, d.name, d.attr], [d.num, d.grade, d.auto], 24, 536, [74, 106, 138], [20, 28, 20]);
        nameplate(c, 14, 6, 230, 30, o);
      },
    },
    {
      id: "folder", name: "Folder tab", family: "Classic",
      paint(c, k) {
        c.fillStyle = k; c.fillRect(380, 0, 180, 48);
        c.fillStyle = WHITE; c.fillRect(388, 6, 164, 26);
        rect(c, 2.5, 36, 555, 121.5); fillWith(c, WHITE); strokeWith(c, k, 5);
      },
      content(c, d, o) {
        T(c, [d.grade, d.auto].filter(Boolean).join(" · "), 470, 25, 17, "center", 150);

        rect(c, 1.5, 1.5, 557, 157); strokeWith(c, k, 3);
      },
      content(c, d, o) {
        rows(c, [d.ym, d.name, d.attr], [d.num, d.grade, d.auto], 24, 536, [54, 86, 116], [20, 28, 20]);

      },

  ];

  const byId = Object.fromEntries(LAYOUTS.map(l => [l.id, l]));

  function clipSplit(c, split) {
    c.beginPath();
    if (split === "halves") c.rect(280, 0, 280, UH);
    else if (split === "topbottom") c.rect(0, 80, UW, 80);
    else if (split === "pinstripe") {
      c.rect(6, 6, 548, 148);
      c.rect(11, 11, 538, 138);
      c.clip("evenodd");
      return;
    } else if (split === "corners") {
      [[0, 0, 90, 0, 0, 60], [UW, 0, 470, 0, UW, 60], [0, UH, 90, UH, 0, 100], [UW, UH, 470, UH, UW, 100]]
        .forEach(([a, b, x2, y2, x3, y3]) => { c.moveTo(a, b); c.lineTo(x2, y2); c.lineTo(x3, y3); c.closePath(); });
    }
    c.clip();
  }

  function drawTag(c, scale, layout, d, o) {
    c.setTransform(scale, 0, 0, scale, 0, 0);
    c.fillStyle = WHITE;
    c.fillRect(0, 0, UW, UH);
    c.save(); layout.paint(c, o.c1); c.restore();
    if (o.split !== "none") {
      c.save(); clipSplit(c, o.split); layout.paint(c, o.c2); c.restore();
    }
    c.save(); layout.content(c, d, o); c.restore();
    c.setTransform(1, 0, 0, 1, 0, 0);
  }

  // ---------- data ----------

  function readData() {
    const v = id => fields[id].value.trim();
    const grade = v("line5");
    const i = grade.lastIndexOf(" ");
    return {
      ym: v("line1"), name: v("line2"), attr: v("line3"),
      num: v("line4"), grade, auto: v("line6"),
      // big-number layouts show "MINT" small and "10" large
      gWord: i > 0 ? grade.slice(0, i) : "",
      gNum: i > 0 ? grade.slice(i + 1) : grade,
    };
  }

  function currentPlate() {
    const checked = document.querySelector('input[name="plate"]:checked');
    return checked ? checked.value : "white";
  }

  function options() {
    return { c1: state.c1, c2: state.c2, split: splitEl.value, plate: currentPlate() };
  }

  function colorName(hex) {
    const p = PRESETS.find(([, , h]) => h.toLowerCase() === hex.toLowerCase());
    return p ? p[0] : hex;
  }

  // ---------- controls ----------

  // Layout dropdown, grouped by family
  const families = [...new Set(LAYOUTS.map(l => l.family))];
  families.forEach(f => {
    const g = document.createElement("optgroup");
    g.label = f;
    LAYOUTS.filter(l => l.family === f).forEach(l => {
      const opt = document.createElement("option");
      opt.value = l.id;
      opt.textContent = l.name;
      g.appendChild(opt);
    });
    layoutEl.appendChild(g);
  });
  layoutEl.value = "original";

  function buildSwatches(el, key, group) {
    PRESETS.forEach(([value, label, hex]) => {
      const lab = document.createElement("label");
      lab.className = "swatch";
      lab.style.setProperty("--dot", hex);
      const input = document.createElement("input");
      input.type = "radio";
      input.name = group;
      input.value = hex;
      const span = document.createElement("span");
      span.textContent = label;
      lab.append(input, span);
      el.appendChild(lab);
    });
    const custom = document.createElement("label");
    custom.className = "custom";
    const picker = document.createElement("input");
    picker.type = "color";
    picker.setAttribute("aria-label", group === "frame" ? "Custom frame color" : "Custom second color");
    const span = document.createElement("span");
    span.textContent = "Custom";
    custom.append(picker, span);
    el.appendChild(custom);

    const sync = () => {
      el.querySelectorAll('input[type="radio"]').forEach(r => {
        r.checked = r.value.toLowerCase() === state[key].toLowerCase();
      });
      picker.value = state[key];
    };
    el.querySelectorAll('input[type="radio"]').forEach(r =>
      r.addEventListener("change", () => { state[key] = r.value; sync(); generate(); }));
    picker.addEventListener("input", () => { state[key] = picker.value; sync(); generate(); });
    sync();
  }

  buildSwatches(document.getElementById("swatches1"), "c1", "frame");
  buildSwatches(document.getElementById("swatches2"), "c2", "frame2");

  // ---------- render ----------

  function generate() {
    drawTag(ctx, canvas.width / UW, byId[layoutEl.value] || LAYOUTS[0], readData(), options());
    statusEl.textContent = "";
  }

  let debounceId = null;
  function scheduleGenerate() {
    clearTimeout(debounceId);
    debounceId = setTimeout(generate, 120);
  }

  // ---------- download + logging ----------

  function makeThumbnail() {
    const w = 400;
    const h = Math.round(w * canvas.height / canvas.width);
    const thumb = document.createElement("canvas");
    thumb.width = w;
    thumb.height = h;
    thumb.getContext("2d").drawImage(canvas, 0, 0, w, h);
    return thumb.toDataURL("image/jpeg", 0.75);
  }

  function logDownload() {
    if (!LOG_URL) return;
    try {
      const o = options();
      const entry = {
        frame: colorName(o.c1),
        line1: fields.line1.value.trim(),
        line2: fields.line2.value.trim(),
        line3: fields.line3.value.trim(),
        line4: fields.line4.value.trim(),
        line5: fields.line5.value.trim(),
        line6: fields.line6.value.trim(),
        layout: layoutEl.value,
        colorStyle: o.split,
        frame2: o.split === "none" ? "" : colorName(o.c2),
        nameplate: o.plate,
      };

      // Skip repeat downloads of the same tag in one visit.
      const key = JSON.stringify(entry);
      if (key === lastLoggedKey) return;
      lastLoggedKey = key;

      let timeZone = "";
      try { timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}

      const payload = Object.assign(entry, {
        language: navigator.language || "",
        timeZone,
        thumbnail: makeThumbnail(),
      });

      // text/plain keeps this a simple request that Apps Script accepts from any site.
      fetch(LOG_URL, {
        method: "POST",
        mode: "no-cors",
        keepalive: true,
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      }).catch(() => {});
    } catch (e) {
      // Logging never blocks the download.
    }
  }

  function download() {
    generate();
    canvas.toBlob((blob) => {
      if (!blob) {
        statusEl.textContent = "Something went wrong making the file. Please try again.";
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Beach-tag.jpg";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      statusEl.textContent = "Downloaded.";
    }, "image/jpeg", 0.95);

    logDownload();
  }

  downloadBtn.addEventListener("click", download);
  layoutEl.addEventListener("change", generate);
  splitEl.addEventListener("change", () => {
    color2Set.hidden = splitEl.value === "none";
    generate();
  });
  plateInputs.forEach(el => el.addEventListener("change", generate));
  Object.values(fields).forEach(el => el.addEventListener("input", scheduleGenerate));

  generate();
})();
